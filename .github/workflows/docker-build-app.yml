name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:latest
      volumes:
        - ${{ github.workspace }}:/CASDesignerToolkit
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Build from Docker image
      run: bash -c "/CASDesignerToolkit/tools/build_debian.sh && cd /CASDesignerToolkit/CASDesignerToolkit/bin/Release && rm Newtonsoft.Json.xml OpenTK.xml s3pi*.xml System.Custom.xml TeximpNet.xml && /CASDesignerToolkit/tools/bundle_debian.sh"
    - uses: actions/checkout@v4
    - name: Upload Linux amd64 artifact
      uses: actions/upload-artifact@v4
      with:
        name: CASDesignerToolkit-linux-amd64
        path: /CASDesignerToolkit/CASDesignerToolkit/bin/Release/dist/CASDesignerToolkit-linux-amd64.rar
    - name: Upload Windows i386 artifact
      uses: actions/upload-artifact@v4
      with:
        name: CASDesignerToolkit-win32-i386
        path: /CASDesignerToolkit/CASDesignerToolkit/bin/Release/dist/CASDesignerToolkit-win32-i386.rar
    - name: Upload Windows i386 self-extractor artifact
      uses: actions/upload-artifact@v4
      with:
        name: CASDesignerToolkit-Self-Extractor
        path: /CASDesignerToolkit/CASDesignerToolkit/bin/Release/dist/CASDesignerToolkit-Self-Extractor.exe
