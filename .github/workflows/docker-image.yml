name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build from Docker image
      run: tools/build.sh
    - name: Upload Linux amd64 artifact
      uses: actions/upload-artifact@v4
      with:
        name: CASDesignerToolkit-linux-amd64
        path: CASDesignerToolkit/bin/Release/dist/CASDesignerToolkit-linux-amd64.rar
    - name: Upload Windows i386 artifact
      uses: actions/upload-artifact@v4
      with:
        name: CASDesignerToolkit-win32-i386
        path: CASDesignerToolkit/bin/Release/dist/CASDesignerToolkit-win32-i386.rar
    - name: Upload Windows i386 self-extractor artifact
      uses: actions/upload-artifact@v4
      with:
        name: CASDesignerToolkit-Self-Extractor
        path: CASDesignerToolkit/bin/Release/dist/CASDesignerToolkit-Self-Extractor.exe
